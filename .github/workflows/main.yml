name: Auto Build Android Project from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find and Extract Android Project ZIP
        run: |
          echo "Searching for Android ZIP..."
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root!"
            exit 1
          fi
          
          echo "Found ZIP: $ZIP_FILE"
          echo "Extracting project..."
          unzip -q "$ZIP_FILE" -d extracted_project
          
          # Find directory containing settings.gradle or settings.gradle.kts
          PROJECT_ROOT=$(find extracted_project -name "settings.gradle*" -exec dirname {} \; | head -n 1)
          
          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: settings.gradle not found inside ZIP!"
            exit 1
          fi
          
          echo "Detected Project Root: $PROJECT_ROOT"
          echo "PROJECT_DIR=$PROJECT_ROOT" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          cd $PROJECT_DIR
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Locate and Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EV-Assistant-APK
          path: |
            **/build/outputs/apk/debug/*.apk
